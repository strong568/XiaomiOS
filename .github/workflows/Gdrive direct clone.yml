name: GDrive Direct Clone

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "Google Drive File hoặc Folder URL nguồn"
        required: true
      dest_folder:
        description: "Tên thư mục đích trên Google Drive của bạn"
        required: false
        default: "Mirror-Cloud"

jobs:
  server_side_clone:
    runs-on: ubuntu-latest

    steps:
      - name: Install Tools
        run: >
          sudo apt update &&
          sudo apt install -y aria2 curl jq &&
          curl -s https://rclone.org/install.sh | sudo bash &&
          pip3 install --no-cache-dir gdown

      - name: Clone / Copy to Google Drive
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
          GDRIVE_COOKIES: ${{ secrets.GDRIVE_COOKIES }}
        run: |
          set -e
          echo "🚀 Bắt đầu quy trình sao chép Google Drive..."

          if [ -z "${RCLONE_CONFIG_DATA:-}" ]; then
            echo "❌ Lỗi: Chưa cấu hình Secrets RCLONE_CONFIG!"
            exit 1
          fi

          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf

          RAW_URL="${{ github.event.inputs.source_url }}"
          DEST="${{ github.event.inputs.dest_folder }}"

          # 1. Bóc tách ID nguồn
          if echo "$RAW_URL" | grep -q "id="; then
            TARGET_ID=$(echo "$RAW_URL" | grep -oP '(?<=id=)[a-zA-Z0-9_-]+')
          elif echo "$RAW_URL" | grep -q "/d/"; then
            TARGET_ID=$(echo "$RAW_URL" | grep -oP '(?<=/d/)[a-zA-Z0-9_-]+')
          elif echo "$RAW_URL" | grep -q "/folders/"; then
            TARGET_ID=$(echo "$RAW_URL" | grep -oP '(?<=/folders/)[a-zA-Z0-9_-]+')
          else
            TARGET_ID="${RAW_URL##*/}"
          fi
          TARGET_ID=$(echo "$TARGET_ID" | tr -d ' \n\r')

          case "$RAW_URL" in
            *folder*) TARGET_KIND="FOLDER" ;;
            *)        TARGET_KIND="FILE" ;;
          esac

          echo "🔍 Loại nguồn: $TARGET_KIND"
          echo "📂 Drive ID nguồn: $TARGET_ID"

          # 2. Lấy thông tin Tên và Dung lượng nguồn
          INPUT_NAME=""
          INPUT_SIZE=""

          if [ "$TARGET_KIND" = "FILE" ]; then
            DL_PAGE=$(curl -sL "https://drive.usercontent.google.com/download?id=${TARGET_ID}&export=download")
            INPUT_SIZE=$(echo "$DL_PAGE" | grep -oP '\([0-9.,]+\s*[KMGTP]?i?B?\)' | tr -d '()' | head -n 1 || true)

            PAGE_TITLE=$(curl -sL "https://drive.google.com/file/d/${TARGET_ID}/view" | grep -oP '(?<=<meta property="og:title" content=").*?(?=")' | head -n 1 || true)
            if [ -n "$PAGE_TITLE" ]; then
              INPUT_NAME="$PAGE_TITLE"
            fi
          else
            FOLDER_INFO=$(rclone size "gdrive,root_folder_id=${TARGET_ID}:" 2>/dev/null || true)
            if [ -n "$FOLDER_INFO" ]; then
              INPUT_SIZE=$(echo "$FOLDER_INFO" | grep -oP '(?<=Total size: ).*?(?= \()' | tr -d ' ' || true)
            fi
            INPUT_NAME="Folder_${TARGET_ID}"
          fi

          [ -z "$INPUT_NAME" ] && INPUT_NAME="File_${TARGET_ID}"
          [ -z "$INPUT_SIZE" ] && INPUT_SIZE="Không xác định"

          echo "📄 Tên nguồn phát hiện: $INPUT_NAME"
          echo "📦 Dung lượng nguồn: $INPUT_SIZE"

          # 3. Tạo thư mục đích và lấy chính xác Folder ID
          rclone mkdir "gdrive:${DEST}"
          DEST_FOLDER_ID=$(rclone backend fileid gdrive: "${DEST}" 2>/dev/null | tr -d ' \n\r')
          if [ -z "$DEST_FOLDER_ID" ] \vert{}\vert{} [ "$DEST_FOLDER_ID" = "Root" ]; then
            DEST_FOLDER_ID=$(rclone lsjson "gdrive:" --dirs-only 2>/dev/null | jq -r ".[] | select(.Path==\"${DEST}\") | .ID" | head -n 1 | tr -d ' \n\r')
          fi

          echo "📂 Folder ID đích (${DEST}):${DEST_FOLDER_ID}"

          COPIED_SUCCESS=0

          # 4. THỰC HIỆN SERVER-SIDE COPY THEO CHUẨN GOOGLE API
          echo "⚡ Đang nhân bản Server-Side qua API..."
          if [ "$TARGET_KIND" = "FOLDER" ]; then
            if rclone copy "gdrive,root_folder_id=${TARGET_ID}:" "gdrive:${DEST}" \
                --drive-server-side-across-configs \
                --drive-acknowledge-abuse \
                --progress \
                --transfers 8; then
              COPIED_SUCCESS=1
              METHOD_USED="Server-Side Direct (Folder)"
            fi
          else
            ACCESS_TOKEN=$(rclone backend token gdrive: 2>/dev/null | jq -r '.access_token // empty')
            
            if [ -n "$ACCESS_TOKEN" ]; then
              # Khởi tạo body metadata: gán parents và giữ đúng name
              if [ -n "$DEST_FOLDER_ID" ]; then
                REQ_BODY=$(jq -n --arg pid "$DEST_FOLDER_ID" --arg name "$INPUT_NAME" '{parents: [$pid], name:$name}')
              else
                REQ_BODY=$(jq -n --arg name "$INPUT_NAME" '{name: $name}')
              fi

              API_RESP=$(curl -s -X POST \
                -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                -H "Content-Type: application/json; charset=UTF-8" \
                -d "$REQ_BODY" \
                "https://www.googleapis.com/drive/v3/files/${TARGET_ID}/copy?supportsAllDrives=true")

              COPIED_FILE_ID=$(echo "$API_RESP" | jq -r '.id // empty')
              if [ -n "$COPIED_FILE_ID" ]; then
                COPIED_SUCCESS=1
                METHOD_USED="Server-Side Direct (Drive API Copy)"
                echo "🎉 Nhân bản thành công tức thì với File ID: $COPIED_FILE_ID"
              else
                echo "⚠️ API response: $API_RESP"
              fi
            fi

            # Fallback tầng 2: rclone copyid nếu curl gặp sự cố token
            if [ "$COPIED_SUCCESS" -ne 1 ]; then
              echo "⚡ Thử lại với rclone copyid..."
              rclone backend copyid gdrive: "$TARGET_ID" "gdrive:${INPUT_NAME}" > copy.log 2>&1 || true
              if [ -s copy.log ] && ! grep -qiE "failed|error" copy.log; then
                rclone move "gdrive:${INPUT_NAME}" "gdrive:${DEST}/" 2>/dev/null || true
                COPIED_SUCCESS=1
                METHOD_USED="Server-Side Direct (rclone copyid)"
              fi
            fi
          fi

          # 5. Fallback tải về runner nếu Server-Side bị chặn hoàn toàn
          if [ "$COPIED_SUCCESS" -eq 1 ]; then
            echo "🎉 Hoàn tất sao chép Server-Side vào ${DEST}!"
          else
            echo "⚠️ Không thể copy Server-Side, chuyển sang gdown..."
            METHOD_USED="gdown Download & Upload"
            mkdir -p temp_transfer
            cd temp_transfer

            COOKIE_ARGS=()
            if [ -n "${GDRIVE_COOKIES:-}" ]; then
              echo "$GDRIVE_COOKIES" > ../cookies_auth.txt
              COOKIE_ARGS=(--cookies ../cookies_auth.txt)
            fi

            if [ "$TARGET_KIND" = "FOLDER" ]; then
              gdown --folder "https://drive.google.com/drive/folders/${TARGET_ID}" "${COOKIE_ARGS[@]}" || true
            else
              gdown "https://drive.google.com/uc?id=${TARGET_ID}" -O "${INPUT_NAME}" "${COOKIE_ARGS[@]}" || true
            fi
            cd ..

            find ./temp_transfer -maxdepth 1 -type f -name "download" -size -100k -delete 2>/dev/null || true

            if [ -z "$(ls -A ./temp_transfer 2>/dev/null)" ]; then
              echo "❌ Không tải được file từ link nguồn!"
              exit 1
            fi

            echo "🚀 Đang upload file vào Google Drive (${DEST})..."
            rclone copy ./temp_transfer "gdrive:${DEST}" --progress --drive-chunk-size 64M --transfers 4
            rm -rf ./temp_transfer
          fi

          # 6. Xuất báo cáo tóm tắt
          set +e
          DEST_LINK=$(rclone link "gdrive:${DEST}" 2>/dev/null)
          rclone lsjson "gdrive:${DEST}" | jq '[.[] | select(.Name != "cookies.txt" and .Name != "download")]' > dest_files.json 2>/dev/null

          OUTPUT_FILE="summary_output.md"
          > "$OUTPUT_FILE"

          ITEMS_COUNT=$(jq 'length' dest_files.json 2>/dev/null || echo 0)
          if [ "$ITEMS_COUNT" -gt 0 ]; then
            for i in $(seq 0$((ITEMS_COUNT - 1))); do
              FNAME=$(jq -r ".[$i].Name" dest_files.json)
              FSIZE_B=$(jq -r ".[$i].Size" dest_files.json)
              FSIZE=$(numfmt --to=iec-i --suffix=B --format="\%.2f" "$FSIZE_B" 2>/dev/null)
              FID=$(rclone backend fileid gdrive: "${DEST}/${FNAME}" 2>/dev/null | tr -d ' \n\r')
              if [ -n "$FID" ]; then
                echo "- 📄 **${FNAME}** (${FSIZE}) - [👉 Mở file trên Drive](https://drive.google.com/file/d/${FID}/view?usp=sharing)" >> "$OUTPUT_FILE"
              else
                echo "- 📄 **${FNAME}** (${FSIZE})" >> "$OUTPUT_FILE"
              fi
            done
          fi

          echo "INPUT_NAME=${INPUT_NAME}" >> $GITHUB_ENV
          echo "INPUT_SIZE=${INPUT_SIZE}" >> $GITHUB_ENV
          echo "DEST_LINK=${DEST_LINK}" >> $GITHUB_ENV
          echo "METHOD_USED=${METHOD_USED}" >> $GITHUB_ENV
          set -e

      - name: Workflow Summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            {
              echo "### ✅ Hoàn tất sao chép sang Google Drive"
              echo ""
              echo "#### 📥 Nguồn (Input):"
              echo "- **URL nguồn:** [${{ github.event.inputs.source_url }}](${{ github.event.inputs.source_url }})"
              echo "- **Tên file/nguồn:** \`${INPUT_NAME}\`"
              echo "- **Dung lượng nguồn:** \`${INPUT_SIZE}\`"
              echo "- **Phương thức áp dụng:** \`${METHOD_USED}\`"
              echo ""
              echo "#### 📤 Đích đến (Output):"
              echo "- **Thư mục lưu trữ:** \`${{ github.event.inputs.dest_folder }}\`"
              if [ -n "${DEST_LINK:-}" ]; then
                echo "- **Link thư mục:** [Mở thư mục đích](${DEST_LINK})"
              fi
              echo ""
              echo "##### 📄 Danh sách file trong thư mục đích:"
              cat summary_output.md 2>/dev/null || echo "Không có file nào."
            } >> $GITHUB_STEP_SUMMARY
          else
            {
              echo "### ❌ Thao tác thất bại"
              echo "- **URL nguồn:** [${{ github.event.inputs.source_url }}](${{ github.event.inputs.source_url }})"
              echo "- Quá trình sao chép thất bại. Vui lòng kiểm tra quyền truy cập file hoặc cookie."
            } >> $GITHUB_STEP_SUMMARY
          fi
          
