name: GDrive Server-Side Direct Clone

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "Google Drive File hoặc Folder URL nguồn"
        required: true

      dest_folder:
        description: "Tên thư mục đích trên Google Drive của bạn"
        required: false
        default: "Mirror-Cloud"

jobs:
  server_side_clone:
    runs-on: ubuntu-latest

    steps:
      - name: Install Tools
        run: |
          sudo apt update
          sudo apt install -y aria2 curl jq
          curl https://rclone.org/install.sh | sudo bash
          pip3 install --no-cache-dir gdown

      - name: Clone / Copy to Google Drive
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
          GDRIVE_COOKIES: ${{ secrets.GDRIVE_COOKIES }}
        run: |
          set -e
          echo "🚀 Bắt đầu quy trình sao chép Google Drive..."

          if [ -z "${RCLONE_CONFIG_DATA:-}" ]; then
            echo "❌ Lỗi: Chưa cấu hình Secrets RCLONE_CONFIG!"
            exit 1
          fi

          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf

          COOKIE_OPT=""
          if [ -n "${GDRIVE_COOKIES:-}" ]; then
            echo "$GDRIVE_COOKIES" > cookies.txt
            COOKIE_OPT="--cookies cookies.txt"
          fi

          RAW_URL="${{ github.event.inputs.source_url }}"
          DEST="${{ github.event.inputs.dest_folder }}"

          # 1. Trích xuất ID nguồn
          TARGET_ID=$(echo "$RAW_URL" | sed -E 's/.*(\/d\/|folders\/|id=)//; s/[/?&].*//' | tr -d ' \n\r')

          if echo "$RAW_URL" | grep -qE "folders\/|folder"; then
            TARGET_KIND="FOLDER"
          else
            TARGET_KIND="FILE"
          fi

          echo "🔍 Loại nguồn: $TARGET_KIND"
          echo "📂 Drive ID nguồn: $TARGET_ID"

          if [ -z "$TARGET_ID" ]; then
            echo "❌ Không trích xuất được Google Drive ID hợp lệ!"
            exit 1
          fi

          # Tạo thư mục đích nếu chưa có và lấy Folder ID của đích
          rclone mkdir "gdrive:${DEST}"
          DEST_DIR_ID=$(rclone backend fileid gdrive: "${DEST}" 2>/dev/null | tr -d ' \n\r' || echo "")
          echo "📂 Folder ID đích (${DEST}):$DEST_DIR_ID"

          COPIED_SUCCESS=0

          # 2. Bước 1: Thử Server-Side Copy
          echo "⚡ [Cách 1] Đang thử nhân bản trực tiếp bằng Server-Side..."
          if [ "$TARGET_KIND" = "FOLDER" ]; then
            if rclone copy ":drive,root_folder_id=${TARGET_ID}:" "gdrive:${DEST}" \
                --drive-server-side-across-configs \
                --drive-acknowledge-abuse \
                --progress \
                --transfers 8; then
              COPIED_SUCCESS=1
              METHOD_USED="Server-Side Direct (Folder)"
            fi
          else
            # Chạy backend copyid chuẩn: truyền ID thư mục đích (DEST_DIR_ID)
            if [ -n "$DEST_DIR_ID" ] && rclone backend copyid gdrive: "$TARGET_ID" "$DEST_DIR_ID"; then
              COPIED_SUCCESS=1
              METHOD_USED="Server-Side Direct (File)"
            elif rclone copy ":drive,root_folder_id=${TARGET_ID}:" "gdrive:${DEST}" \
                --drive-server-side-across-configs \
                --drive-acknowledge-abuse \
                --progress; then
              COPIED_SUCCESS=1
              METHOD_USED="Server-Side Direct (Root ID)"
            fi
          fi

          # 3. Bước 2: Fallback sang gdown/aria2c nếu Server-Side không thành công
          if [ "$COPIED_SUCCESS" -eq 1 ]; then
            echo "🎉 Server-Side Copy thành công!"
          else
            echo "⚠️ Server-Side không khả dụng. Chuyển sang tải về máy ảo bằng gdown/aria2c..."
            METHOD_USED="gdown Download & Upload"
            mkdir -p temp_transfer

            if [ "$TARGET_KIND" = "FOLDER" ]; then
              gdown --folder "https://drive.google.com/drive/folders/${TARGET_ID}" -O ./temp_transfer $COOKIE_OPT || true
            else
              cd temp_transfer
              gdown "https://drive.google.com/uc?id=${TARGET_ID}" $COOKIE_OPT || \
              aria2c --header="User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
                     --check-certificate=false \
                     --allow-overwrite=true \
                     --auto-file-renaming=false \
                     --content-disposition \
                     -s16 -x16 -j16 \
                     "https://drive.google.com/uc?export=download&id=${TARGET_ID}"
              cd ..
            fi

            if [ -z "$(ls -A ./temp_transfer 2>/dev/null)" ]; then
              echo "❌ Không tải được file từ link nguồn!"
              exit 1
            fi

            echo "🚀 Đang upload file lên Google Drive..."
            rclone copy ./temp_transfer "gdrive:${DEST}" --progress --drive-chunk-size 64M --transfers 4
            rm -rf ./temp_transfer
          fi

          # 4. Trích xuất thông tin chi tiết các file trong thư mục đích
          DEST_LINK=$(rclone link "gdrive:${DEST}" 2>/dev/null || echo "")
          DEST_FILES_JSON=$(rclone lsjson "gdrive:${DEST}" 2>/dev/null || echo "[]")

          # File mới nhất vừa được thêm vào
          LATEST_FILE_NAME=$(echo "$DEST_FILES_JSON" | jq -r 'sort_by(.ModTime) | reverse | .[0].Name // "N/A"')
          LATEST_BYTES=$(echo "$DEST_FILES_JSON" | jq -r 'sort_by(.ModTime) | reverse | .[0].Size // empty')
          if [ -n "$LATEST_BYTES" ] && [ "$LATEST_BYTES" -ge 0 ] 2>/dev/null; then
            SRC_SIZE=$(numfmt --to=iec-i --suffix=B --format="%.2f" "$LATEST_BYTES" 2>/dev/null \vert{}\vert{} echo "${LATEST_BYTES} B")
          else
            SRC_SIZE="N/A"
          fi
          SRC_NAME="$LATEST_FILE_NAME"

          # Tạo bảng hiển thị file
          OUTPUT_TABLE="| Tên File | Dung Lượng | Liên Kết |\n| :--- | :--- | :--- |\n"
          while IFS= read -r item; do
            [ -z "$item" ] && continue
            FNAME=$(echo "$item" | jq -r '.Name')
            FSIZE_B=$(echo "$item" | jq -r '.Size')
            FSIZE=$(numfmt --to=iec-i --suffix=B --format="%.2f" "$FSIZE_B" 2>/dev/null \vert{}\vert{} echo "${FSIZE_B} B")
            FID=$(rclone backend fileid gdrive: "${DEST}/${FNAME}" 2>/dev/null | tr -d ' \n\r' || echo "")
            
            if [ -n "$FID" ]; then
              FLINK="https://drive.google.com/file/d/${FID}/view?usp=sharing"
              OUTPUT_TABLE="${OUTPUT_TABLE}| \`${FNAME}\` | ${FSIZE} \vert{} [👉 Mở file](${FLINK}) |\n"
            else
              OUTPUT_TABLE="${OUTPUT_TABLE}| \`${FNAME}\` | ${FSIZE} | N/A |\n"
            fi
          done < <(echo "$DEST_FILES_JSON" | jq -c '.[]')

          # Đưa vào môi trường tóm tắt
          echo "SRC_NAME=${SRC_NAME}" >> $GITHUB_ENV
          echo "SRC_SIZE=${SRC_SIZE}" >> $GITHUB_ENV
          echo "DEST_LINK=${DEST_LINK}" >> $GITHUB_ENV
          echo "METHOD_USED=${METHOD_USED}" >> $GITHUB_ENV
          {
            echo "OUTPUT_TABLE<<EOF"
            echo -e "$OUTPUT_TABLE"
            echo "EOF"
          } >> $GITHUB_ENV

      - name: Workflow Summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            {
              echo "### ✅ Hoàn tất sao chép sang Google Drive"
              echo ""
              echo "#### 📥 Nguồn (Input):"
              echo "- **URL nguồn:** [${{ github.event.inputs.source_url }}](${{ github.event.inputs.source_url }})"
              echo "- **Tên file nhận diện:** \`${SRC_NAME}\`"
              echo "- **Dung lượng:** \`${SRC_SIZE}\`"
              echo "- **Phương thức áp dụng:** \`${METHOD_USED}\`"
              echo ""
              echo "#### 📤 Đích đến (Output):"
              echo "- **Thư mục lưu trữ:** \`${{ github.event.inputs.dest_folder }}\`"
              if [ -n "${DEST_LINK:-}" ]; then
                echo "- **Link thư mục Drive:** [Mở thư mục đích](${DEST_LINK})"
              fi
              echo ""
              echo "##### 📄 Chi tiết file:"
              echo -e "${OUTPUT_TABLE}"
            } >> $GITHUB_STEP_SUMMARY
          else
            {
              echo "### ❌ Thao tác thất bại"
              echo "- **URL nguồn:** [${{ github.event.inputs.source_url }}](${{ github.event.inputs.source_url }})"
              echo "- Quá trình sao chép thất bại. Vui lòng kiểm tra quyền truy cập file hoặc cookie."
            } >> $GITHUB_STEP_SUMMARY
          fi
