name: GDrive Server-Side Direct Clone

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "Google Drive File hoặc Folder URL nguồn"
        required: true

      dest_folder:
        description: "Tên thư mục đích trên Google Drive của bạn"
        required: false
        default: "Mirror-Cloud"

jobs:
  server_side_clone:
    runs-on: ubuntu-latest

    steps:
      - name: Install Tools
        run: |
          sudo apt update
          sudo apt install -y aria2 curl
          curl https://rclone.org/install.sh | sudo bash
          pip3 install --no-cache-dir gdown

      - name: Clone / Copy to Google Drive
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
          GDRIVE_COOKIES: ${{ secrets.GDRIVE_COOKIES }}
        run: |
          set -e
          echo "🚀 Bắt đầu quy trình sao chép Google Drive..."

          if [ -z "${RCLONE_CONFIG_DATA:-}" ]; then
            echo "❌ Lỗi: Chưa cấu hình Secrets RCLONE_CONFIG!"
            exit 1
          fi

          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf

          COOKIE_OPT=""
          if [ -n "${GDRIVE_COOKIES:-}" ]; then
            echo "$GDRIVE_COOKIES" > cookies.txt
            COOKIE_OPT="--cookies cookies.txt"
          fi

          RAW_URL="${{ github.event.inputs.source_url }}"
          DEST="${{ github.event.inputs.dest_folder }}"

          # 1. Trích xuất ID chuẩn xác
          TARGET_ID=$(echo "$RAW_URL" | sed -E 's/.*(\/d\/|folders\/|id=)//; s/[/?&].*//' | tr -d ' \n\r')

          if echo "$RAW_URL" | grep -qE "folders\/|folder"; then
            TARGET_KIND="FOLDER"
          else
            TARGET_KIND="FILE"
          fi

          echo "🔍 Loại nguồn: $TARGET_KIND"
          echo "📂 Drive ID: $TARGET_ID"

          if [ -z "$TARGET_ID" ]; then
            echo "❌ Không trích xuất được Google Drive ID hợp lệ!"
            exit 1
          fi

          SERVER_SIDE_SUCCESS=0

          # 2. Bước 1: Thử Server-Side Copy trước (Không tốn mạng tải về)
          echo "⚡ [Cách 1] Đang thử nhân bản trực tiếp bằng Server-Side..."
          if [ "$TARGET_KIND" = "FOLDER" ]; then
            if rclone copy ":drive,root_folder_id=${TARGET_ID}:" "gdrive:${DEST}" \
                --drive-server-side-across-configs \
                --drive-acknowledge-abuse \
                --progress \
                --transfers 8; then
              SERVER_SIDE_SUCCESS=1
            fi
          else
            if rclone backend copyid gdrive: "$TARGET_ID" "${DEST}/" 2>/dev/null; then
              SERVER_SIDE_SUCCESS=1
            elif rclone copy ":drive,root_folder_id=${TARGET_ID}:" "gdrive:${DEST}" \
                --drive-server-side-across-configs \
                --drive-acknowledge-abuse \
                --progress 2>/dev/null; then
              SERVER_SIDE_SUCCESS=1
            fi
          fi

          # 3. Bước 2: Nếu Server-Side thất bại, tự động Fallback sang gdown
          if [ "$SERVER_SIDE_SUCCESS" -eq 1 ]; then
            echo "🎉 Server-Side Copy thành công! Không cần tải qua máy ảo."
            METHOD_USED="Server-Side Direct (Không tốn băng thông)"
          else
            echo "⚠️ Server-Side bị Google hạn chế. Chuyển sang [Cách 2] Tải về bằng gdown..."
            METHOD_USED="gdown Download & Upload"
            mkdir -p temp_transfer

            if [ "$TARGET_KIND" = "FOLDER" ]; then
              gdown --folder "https://drive.google.com/drive/folders/${TARGET_ID}" -O ./temp_transfer $COOKIE_OPT || true
            else
              cd temp_transfer
              gdown "https://drive.google.com/uc?id=${TARGET_ID}" $COOKIE_OPT || \
              aria2c --header="User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
                     --check-certificate=false \
                     --allow-overwrite=true \
                     --auto-file-renaming=false \
                     --content-disposition \
                     -s16 -x16 -j16 \
                     "https://drive.google.com/uc?export=download&id=${TARGET_ID}"
              cd ..
            fi

            if [ -z "$(ls -A ./temp_transfer 2>/dev/null)" ]; then
              echo "❌ Không tải được file qua gdown!"
              exit 1
            fi

            echo "🚀 Đang upload dữ liệu từ temp_transfer lên Google Drive..."
            rclone copy ./temp_transfer "gdrive:${DEST}" --progress --drive-chunk-size 64M --transfers 4
            rm -rf ./temp_transfer
          fi

          # 4. Lấy link và in danh sách kiểm tra trên Drive
          DEST_LINK=$(rclone link "gdrive:${DEST}" 2>/dev/null || echo "")
          echo "DEST_LINK=${DEST_LINK}" >> $GITHUB_ENV
          echo "METHOD_USED=${METHOD_USED}" >> $GITHUB_ENV

          echo "📋 Danh sách file hiện tại trong thư mục trên Drive:"
          rclone lsl "gdrive:${DEST}"

      - name: Workflow Summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            {
              echo "### ✅ Hoàn tất sao chép sang Google Drive"
              echo ""
              echo "#### 📥 Nguồn (Input):"
              echo "- **URL nguồn:** [${{ github.event.inputs.source_url }}](${{ github.event.inputs.source_url }})"
              echo "- **Phương thức áp dụng:** \`${METHOD_USED}\`"
              echo ""
              echo "#### 📤 Đích đến (Output):"
              echo "- **Thư mục lưu trữ:** \`${{ github.event.inputs.dest_folder }}\`"
              if [ -n "${DEST_LINK:-}" ]; then
                echo "- **Google Drive Link:** [Mở thư mục đích](${DEST_LINK})"
              fi
            } >> $GITHUB_STEP_SUMMARY
          else
            {
              echo "### ❌ Thao tác thất bại"
              echo "- **URL nguồn:** [${{ github.event.inputs.source_url }}](${{ github.event.inputs.source_url }})"
              echo "- Cả Server-Side và gdown đều không thể lấy dữ liệu. Vui lòng kiểm tra quyền truy cập file."
            } >> $GITHUB_STEP_SUMMARY
          fi
