name: GDrive Server-Side Direct Clone

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "Google Drive File hoặc Folder URL nguồn"
        required: true

      dest_folder:
        description: "Tên thư mục đích trên Google Drive của bạn"
        required: false
        default: "Mirror-Cloud"

jobs:
  server_side_clone:
    runs-on: ubuntu-latest

    steps:
      - name: Install Tools
        run: >
          sudo apt update &&
          sudo apt install -y aria2 curl jq &&
          curl -s https://rclone.org/install.sh | sudo bash &&
          pip3 install --no-cache-dir gdown

      - name: Clone / Copy to Google Drive
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
          GDRIVE_COOKIES: ${{ secrets.GDRIVE_COOKIES }}
        run: |
          set -e
          echo "🚀 Bắt đầu quy trình sao chép Google Drive..."

          if [ -z "${RCLONE_CONFIG_DATA:-}" ]; then
            echo "❌ Lỗi: Chưa cấu hình Secrets RCLONE_CONFIG!"
            exit 1
          fi

          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf

          RAW_URL="${{ github.event.inputs.source_url }}"
          DEST="${{ github.event.inputs.dest_folder }}"

          # 1. Bóc tách ID chính xác
          if echo "$RAW_URL" | grep -q "id="; then
            TARGET_ID=$(echo "$RAW_URL" | sed -n 's/.*[?&]id=\([^&#]*\).*/\1/p')
          elif echo "$RAW_URL" | grep -q "/d/"; then
            TARGET_ID=$(echo "$RAW_URL" | sed -n 's/.*\/d\/\([^/?&#]*\).*/\1/p')
          elif echo "$RAW_URL" | grep -q "/folders/"; then
            TARGET_ID=$(echo "$RAW_URL" | sed -n 's/.*\/folders\/\([^/?&#]*\).*/\1/p')
          else
            TARGET_ID="${RAW_URL##*/}"
          fi
          TARGET_ID=$(echo "$TARGET_ID" | tr -d ' \n\r')

          # 2. Xác định loại nguồn (Bắt buộc phải có)
          case "$RAW_URL" in
            *folder*) TARGET_KIND="FOLDER" ;;
            *)        TARGET_KIND="FILE" ;;
          esac

          echo "🔍 Loại nguồn: $TARGET_KIND"
          echo "📂 Drive ID nguồn: $TARGET_ID"

          # 3. Lấy Folder ID đích
          rclone mkdir "gdrive:${DEST}"
          DEST_DIR_ID=$(rclone backend fileid gdrive: "${DEST}" 2>/dev/null | tr -d ' \n\r')
          echo "📂 Folder ID đích (${DEST}): ${DEST_DIR_ID:-'Root'}"

          COPIED_SUCCESS=0

          # 4. Sao chép Server-Side
          echo "⚡ [Cách 1] Đang thử nhân bản trực tiếp bằng Server-Side..."
          if [ "$TARGET_KIND" = "FOLDER" ]; then
            if rclone copy "gdrive,root_folder_id=${TARGET_ID}:" "gdrive:${DEST}" \
                --drive-server-side-across-configs \
                --drive-acknowledge-abuse \
                --progress \
                --transfers 8; then
              COPIED_SUCCESS=1
              METHOD_USED="Server-Side Direct (Folder)"
            fi
          else
            OPT_ARG=()
            if [ -n "$DEST_DIR_ID" ]; then
              OPT_ARG=(-o "dst-dir-id=${DEST_DIR_ID}")
            fi

            # Kiểm tra copyid thật sự thành công (rclone in ra JSON hoặc ID nếu thành công)
            COPY_OUT=$(rclone backend copyid gdrive: "$TARGET_ID" "${OPT_ARG[@]}" 2>&1 || true)
            echo "$COPY_OUT"
            if echo "$COPY_OUT" | grep -qi "id"; then
              COPIED_SUCCESS=1
              METHOD_USED="Server-Side Direct (File)"
            fi
          fi

          # 5. Fallback tải về máy ảo (Dùng gdown với fuzzy mode để qua mặt trang cảnh báo)
          if [ "$COPIED_SUCCESS" -eq 1 ]; then
            echo "🎉 Server-Side Copy thành công!"
          else
            echo "⚠️ Server-Side không khả dụng, chuyển sang tải gdown..."
            METHOD_USED="gdown Download & Upload"
            mkdir -p temp_transfer
            cd temp_transfer

            COOKIE_FILE=""
            if [ -n "${GDRIVE_COOKIES:-}" ]; then
              echo "$GDRIVE_COOKIES" > ../cookies_auth.txt
              COOKIE_FILE="--cookies ../cookies_auth.txt"
            fi

            if [ "$TARGET_KIND" = "FOLDER" ]; then
              gdown --folder "https://drive.google.com/drive/folders/${TARGET_ID}" $COOKIE_FILE || true
            else
              # Cờ --fuzzy giúp gdown tự vượt trang cảnh báo file quá lớn / virus
              gdown "https://drive.google.com/uc?id=${TARGET_ID}" --fuzzy $COOKIE_FILE || true
            fi
            cd ..

            # Xóa các file rác HTML do tải hỏng nếu có
            find ./temp_transfer -maxdepth 1 -type f -name "download" -size -100k -delete 2>/dev/null || true

            if [ -z "$(ls -A ./temp_transfer 2>/dev/null)" ]; then
              echo "❌ Không tải được file từ link nguồn!"
              exit 1
            fi

            echo "🚀 Đang upload file lên Google Drive..."
            rclone copy ./temp_transfer "gdrive:${DEST}" --progress --drive-chunk-size 64M --transfers 4
            rm -rf ./temp_transfer
          fi

          # 6. Trích xuất thông tin (Loại bỏ cookies.txt khỏi danh sách hiển thị)
          set +e
          DEST_LINK=$(rclone link "gdrive:${DEST}" 2>/dev/null)
          rclone lsjson "gdrive:${DEST}" | jq '[.[] | select(.Name != "cookies.txt" and .Name != "download")]' > dest_files.json 2>/dev/null

          SRC_NAME=$(jq -r 'sort_by(.ModTime) | reverse | .[0].Name // "N/A"' dest_files.json)
          LATEST_BYTES=$(jq -r 'sort_by(.ModTime) | reverse | .[0].Size // empty' dest_files.json)
          
          if [ -n "$LATEST_BYTES" ] && [ "$LATEST_BYTES" -ge 0 ] 2>/dev/null; then
            SRC_SIZE=$(numfmt --to=iec-i --suffix=B --format="%.2f" "$LATEST_BYTES" 2>/dev/null)
          else
            SRC_SIZE="N/A"
          fi

          OUTPUT_FILE="summary_output.md"
          > "$OUTPUT_FILE"

          ITEMS_COUNT=$(jq 'length' dest_files.json 2>/dev/null || echo 0)
          if [ "$ITEMS_COUNT" -gt 0 ]; then
            for i in $(seq 0 $((ITEMS_COUNT - 1))); do
              FNAME=$(jq -r ".[$i].Name" dest_files.json)
              FSIZE_B=$(jq -r ".[$i].Size" dest_files.json)
              FSIZE=$(numfmt --to=iec-i --suffix=B --format="%.2f" "$FSIZE_B" 2>/dev/null)
              FID=$(rclone backend fileid gdrive: "${DEST}/${FNAME}" 2>/dev/null | tr -d ' \n\r')
              
              if [ -n "$FID" ]; then
                echo "- 📄 **${FNAME}** (${FSIZE}) - [👉 Mở file trên Drive](https://drive.google.com/file/d/${FID}/view?usp=sharing)" >> "$OUTPUT_FILE"
              else
                echo "- 📄 **${FNAME}** (${FSIZE})" >> "$OUTPUT_FILE"
              fi
            done
          fi

          echo "SRC_NAME=${SRC_NAME}" >> $GITHUB_ENV
          echo "SRC_SIZE=${SRC_SIZE}" >> $GITHUB_ENV
          echo "DEST_LINK=${DEST_LINK}" >> $GITHUB_ENV
          echo "METHOD_USED=${METHOD_USED}" >> $GITHUB_ENV
          set -e


      - name: Workflow Summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            {
              echo "### ✅ Hoàn tất sao chép sang Google Drive"
              echo ""
              echo "#### 📥 Nguồn (Input):"
              echo "- **URL nguồn:** [${{ github.event.inputs.source_url }}](${{ github.event.inputs.source_url }})"
              echo "- **Tên file gần nhất:** \`${SRC_NAME}\`"
              echo "- **Dung lượng:** \`${SRC_SIZE}\`"
              echo "- **Phương thức áp dụng:** \`${METHOD_USED}\`"
              echo ""
              echo "#### 📤 Đích đến (Output):"
              echo "- **Thư mục lưu trữ:** \`${{ github.event.inputs.dest_folder }}\`"
              if [ -n "${DEST_LINK:-}" ]; then
                echo "- **Link thư mục:** [Mở thư mục đích](${DEST_LINK})"
              fi
              echo ""
              echo "##### 📄 Danh sách file tải lên:"
              cat summary_output.md 2>/dev/null || echo "Không có file nào."
            } >> $GITHUB_STEP_SUMMARY
          else
            {
              echo "### ❌ Thao tác thất bại"
              echo "- **URL nguồn:** [${{ github.event.inputs.source_url }}](${{ github.event.inputs.source_url }})"
              echo "- Quá trình sao chép thất bại. Vui lòng kiểm tra quyền truy cập file hoặc cookie."
            } >> $GITHUB_STEP_SUMMARY
          fi
