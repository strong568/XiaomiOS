name: mirror-cloud choice (Multi-Host Gdrive to Gdrive, HuggingFace & archive.org)

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: "Google Drive (File/Folder) / Pixeldrain / Direct download link"
        required: true

      upload_to_gdrive:
        description: "Tải lên Google Drive"
        type: boolean
        default: true

      upload_to_hf:
        description: "Tải lên Hugging Face"
        type: boolean
        default: true

      upload_to_ia:
        description: "Tải lên Archive.org"
        type: boolean
        default: false

      ia_item_id:
        description: "Archive.org Item ID (nếu chọn upload Archive)"
        required: false
        default: "mirror-cloud"

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip aria2 wget curl
          curl https://rclone.org/install.sh | sudo bash
          pip3 install --no-cache-dir gdown internetarchive huggingface_hub

      - name: Download file or folder (Multi-host support)
        env:
          GDRIVE_COOKIES: ${{ secrets.GDRIVE_COOKIES }}
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
        run: |
          set -e
          echo "🔽 Bắt đầu xử lý tải nguồn..."
          RAW_URL="${{ github.event.inputs.file_url }}"
          echo "Link nguồn: $RAW_URL"
          USER_AGENT="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"

          mkdir -p target_payload

          # Cấu hình Rclone & Cookies nếu có
          HAS_RCLONE=0
          if [ -n "${RCLONE_CONFIG_DATA:-}" ]; then
            mkdir -p ~/.config/rclone
            echo "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf
            HAS_RCLONE=1
          fi

          COOKIE_OPT=""
          if [ -n "${GDRIVE_COOKIES:-}" ]; then
            echo "🔑 Đã nạp GDRIVE_COOKIES để vượt giới hạn tải..."
            echo "$GDRIVE_COOKIES" > cookies.txt
            COOKIE_OPT="--cookies cookies.txt"
          fi

          # 1. Google Drive
          if echo "$RAW_URL" | grep -qE "drive\.google\.com|drive\.usercontent\.google\.com"; then
            echo "📦 Nhận diện nguồn: Google Drive"
            
            # Trích xuất Folder ID hoặc File ID bằng Python (chuẩn xác tuyệt đối, không lo URL bị bọc tham số)
            EXTRACTED_TYPE=$(python3 -c "
            import re, sys
            url = '''$RAW_URL'''
            if 'folders' in url or 'folder' in url:
                m = re.search(r'folders/([a-zA-Z0-9_-]+)', url) or re.search(r'id=([a-zA-Z0-9_-]+)', url)
                if m:
                    print(f'FOLDER:{m.group(1)}')
                    sys.exit(0)
            m = re.search(r'/d/([a-zA-Z0-9_-]+)', url) or re.search(r'id=([a-zA-Z0-9_-]+)', url)
            if m:
                print(f'FILE:{m.group(1)}')
                sys.exit(0)
            print('UNKNOWN:')
            ")

            TARGET_KIND=$(echo "$EXTRACTED_TYPE" | cut -d':' -f1)
            TARGET_ID=$(echo "$EXTRACTED_TYPE" | cut -d':' -f2)

            echo "🔍 Loại nguồn nhận diện: $TARGET_KIND"
            echo "📂 ID chính xác: $TARGET_ID"

            if [ -z "$TARGET_ID" ]; then
              echo "❌ Không trích xuất được Google Drive ID!"
              exit 1
            fi

            # Trường hợp là THƯ MỤC (Folder)
            if [ "$TARGET_KIND" == "FOLDER" ]; then
              DOWNLOAD_SUCCESS=0

              # Cách 1: Tải bằng gdown (đã bỏ cờ lỗi --remaining-ok)
              echo "⚡ Đang tải thư mục bằng gdown..."
              if gdown --folder "https://drive.google.com/drive/folders/${TARGET_ID}" -O ./target_payload $COOKIE_OPT; then
                if [ -n "$(ls -A ./target_payload 2>/dev/null)" ]; then
                  DOWNLOAD_SUCCESS=1
                fi
              fi

              # Cách 2: Nếu gdown bị nghẽn quota, fallback sang Rclone dùng remote đã cấu hình
              if [ "$DOWNLOAD_SUCCESS" -eq 0 ] && [ "$HAS_RCLONE" -eq 1 ]; then
                echo "🚀 Fallback sang Rclone trỏ thẳng Folder ID..."
                rclone copy "gdrive:" ./target_payload \
                  --drive-root-folder-id="$TARGET_ID" \
                  --progress --transfers 4 --drive-acknowledge-abuse || true
              fi

            # Trường hợp là FILE ĐƠN LẺ
            else
              cd target_payload
              gdown "https://drive.google.com/uc?id=${TARGET_ID}" $COOKIE_OPT || \
              aria2c --header="User-Agent: $USER_AGENT" \
                     --check-certificate=false \
                     --allow-overwrite=true \
                     --auto-file-renaming=false \
                     --content-disposition \
                     -s16 -x16 -j16 \
                     "https://drive.google.com/uc?export=download&id=${TARGET_ID}"
              cd ..
            fi


          # 2. Pixeldrain
          elif echo "$RAW_URL" | grep -q "pixeldrain.com"; then
            echo "📦 Nhận diện nguồn: Pixeldrain"
            PIXEL_ID=$(echo "$RAW_URL" | grep -oP '(u\/|file\/)\K[a-zA-Z0-9]+')
            DIRECT_PIXEL="https://pixeldrain.com/api/file/${PIXEL_ID}"
            cd target_payload
            aria2c --header="User-Agent: $USER_AGENT" \
                   --check-certificate=false \
                   --allow-overwrite=true \
                   --auto-file-renaming=false \
                   --content-disposition \
                   -s16 -x16 -j16 \
                   "$DIRECT_PIXEL"
            cd ..

          # 3. Direct Link
          else
            echo "🌐 Nhận diện nguồn: Direct Link"
            cd target_payload
            wget -c --progress=bar:force:noscroll --content-disposition "$RAW_URL"
            cd ..
          fi

          # Kiểm tra dữ liệu tải về
          if [ -z "$(ls -A ./target_payload 2>/dev/null)" ]; then
            echo "❌ Không tìm thấy dữ liệu nào được tải về trong ./target_payload!"
            exit 1
          fi

          echo "📂 Cấu trúc dữ liệu sau khi tải:"
          ls -lh ./target_payload

          TOTAL_SIZE=$(du -sb ./target_payload | cut -f1)
          TOTAL_SIZE_HUMAN=$(du -sh ./target_payload | cut -f1)
          echo "📏 Tổng dung lượng: $TOTAL_SIZE_HUMAN ($TOTAL_SIZE bytes)"

          echo "PAYLOAD_SIZE=$TOTAL_SIZE_HUMAN" >> $GITHUB_ENV

      - name: Upload to Google Drive (Mirror-Cloud)
        if: inputs.upload_to_gdrive == true
        continue-on-error: true
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
        run: |
          if [ -z "${RCLONE_CONFIG_DATA}" ]; then
            echo "⚠️ Bỏ qua: Không tìm thấy RCLONE_CONFIG!"
          else
            mkdir -p ~/.config/rclone
            echo "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf

            echo "🚀 Đồng bộ nguyên trạng thư mục lên Google Drive (Mirror-Cloud)..."
            rclone copy ./target_payload "gdrive:Mirror-Cloud" \
              --progress \
              --drive-chunk-size 64M \
              --transfers 8

            GDRIVE_LINK=$(rclone link "gdrive:Mirror-Cloud" 2>/dev/null || echo "")
            echo "GDRIVE_LINK=${GDRIVE_LINK}" >> $GITHUB_ENV
            echo "✅ Hoàn tất upload Drive!"
          fi

      - name: Upload to Hugging Face
        if: inputs.upload_to_hf == true
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "${HF_TOKEN}" ]; then
            echo "⚠️ Bỏ qua: Không tìm thấy HF_TOKEN!"
          else
            echo "🚀 Upload toàn bộ thư mục lên repo Strong568/Mirror-Cloud..."
            huggingface-cli upload Strong568/Mirror-Cloud \
              ./target_payload \
              . \
              --repo-type model

            HF_REPO="https://huggingface.co/Strong568/Mirror-Cloud/tree/main"
            echo "HF_REPO=${HF_REPO}" >> $GITHUB_ENV
            echo "✅ Hoàn tất upload Hugging Face: ${HF_REPO}"
          fi

      - name: Upload to Archive.org
        if: inputs.upload_to_ia == true
        continue-on-error: true
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          if [ -z "${IA_ACCESS_KEY}" ] \vert{}\vert{} [ -z "${IA_SECRET_KEY}" ]; then
            echo "⚠️ Bỏ qua: Không tìm thấy IA_ACCESS_KEY hoặc IA_SECRET_KEY!"
          else
            INPUT_ID="${{ github.event.inputs.ia_item_id }}"
            if [ -z "$INPUT_ID" ] \vert{}\vert{} [ "$INPUT_ID" == "mirror-cloud" ]; then
              ITEM_ID="mirror-cloud-$(date +%Y%m%d%H%M%S)"
            else
              ITEM_ID="$INPUT_ID"
            fi

            mkdir -p ~/.config
            printf "[s3]\naccess = %s\nsecret = %s\n" "${IA_ACCESS_KEY}" "${IA_SECRET_KEY}" > ~/.config/ia.ini

            echo "🚀 Tải toàn bộ file lên item: $ITEM_ID..."
            cd target_payload
            ia upload "$ITEM_ID" . \
              --metadata="mediatype:software" \
              --metadata="collection:opensource_software" \
              --header="x-archive-queue-derive:0" \
              --retries=3
            cd ..

            IA_LINK="https://archive.org/details/${ITEM_ID}"
            echo "IA_LINK=${IA_LINK}" >> $GITHUB_ENV
            echo "✅ Hoàn tất upload Archive.org: ${IA_LINK}"
          fi

      - name: Workflow Summary
        if: always()
        run: |
          echo "=========================================="
          echo "             WORKFLOW REPORT              "
          echo "=========================================="

          if [ "${{ job.status }}" == "success" ]; then
            {
              echo "### ✅ Mirror Completed Successfully"
              echo ""
              echo "- **Link gốc:** [${{ github.event.inputs.file_url }}](${{ github.event.inputs.file_url }})"
              echo "- **Dung lượng:** \`${PAYLOAD_SIZE}\`"
              if [ -n "${GDRIVE_LINK:-}" ]; then
                echo "- **Google Drive:** [Truy cập thư mục](${GDRIVE_LINK})"
              fi
              if [ -n "${HF_REPO:-}" ]; then
                echo "- **Hugging Face Files:** [Duyệt file trên Repo](${HF_REPO})"
              fi
              if [ -n "${IA_LINK:-}" ]; then
                echo "- **Archive.org Details:** [Xem trên Archive](${IA_LINK})"
              fi
            } >> $GITHUB_STEP_SUMMARY
          else
            {
              echo "### ❌ Mirror Failed"
              echo ""
              echo "- **Link gốc:** [${{ github.event.inputs.file_url }}](${{ github.event.inputs.file_url }})"
              echo "- Quá trình tải hoặc đồng bộ file gặp lỗi. Vui lòng kiểm tra lại log chi tiết."
            } >> $GITHUB_STEP_SUMMARY
          fi
