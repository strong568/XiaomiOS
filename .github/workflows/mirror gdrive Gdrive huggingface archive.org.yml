name: mirror-cloud choice (Multi-Host Gdrive to Gdrive, HuggingFace & archive.org)

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: "Google Drive (File/Folder) / Pixeldrain / Direct download link"
        required: true

      upload_to_gdrive:
        description: "Tải lên Google Drive"
        type: boolean
        default: true

      upload_to_hf:
        description: "Tải lên Hugging Face"
        type: boolean
        default: true

      upload_to_ia:
        description: "Tải lên Archive.org"
        type: boolean
        default: false

      ia_item_id:
        description: "Archive.org Item ID (nếu chọn upload Archive)"
        required: false
        default: "mirror-cloud"

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space on runner
        run: |
          echo "🧹 Dọn dẹp runner để giải phóng ~30GB dung lượng trống..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip aria2 wget curl
          curl https://rclone.org/install.sh | sudo bash
          pip3 install --no-cache-dir gdown internetarchive "huggingface_hub[cli]"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Process, Download & Upload (File-by-File / Pipeline)
        env:
          GDRIVE_COOKIES: ${{ secrets.GDRIVE_COOKIES }}
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          UPLOAD_GDRIVE: ${{ inputs.upload_to_gdrive }}
          UPLOAD_HF: ${{ inputs.upload_to_hf }}
          UPLOAD_IA: ${{ inputs.upload_to_ia }}
          INPUT_IA_ID: ${{ github.event.inputs.ia_item_id }}
          HF_REPO_NAME: "Strong568/Mirror-Cloud"
        run: |
          set -e
          RAW_URL="${{ github.event.inputs.file_url }}"
          USER_AGENT="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
          mkdir -p work_dir

          # 1. Setup Rclone config nếu có
          HAS_RCLONE=0
          if [ -n "${RCLONE_CONFIG_DATA:-}" ]; then
            mkdir -p ~/.config/rclone
            echo "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf
            HAS_RCLONE=1
          fi

          # 2. Setup Archive.org config nếu có
          if [ -n "${IA_ACCESS_KEY:-}" ] && [ -n "${IA_SECRET_KEY:-}" ]; then
            mkdir -p ~/.config
            printf "[s3]\naccess = %s\nsecret = %s\n" "${IA_ACCESS_KEY}" "${IA_SECRET_KEY}" > ~/.config/ia.ini
          fi

          # Định danh Archive.org item ID
          if [ -z "$INPUT_IA_ID" ] || [ "$INPUT_IA_ID" == "mirror-cloud" ]; then
            ITEM_ID="mirror-cloud-$(date +%Y%m%d%H%M%S)"
          else
            ITEM_ID="$INPUT_IA_ID"
          fi

          # Hàm upload 1 file đơn lẻ lên các host được chọn và xóa ngay sau đó
          upload_and_cleanup_file() {
            local file_path="$1"
            local relative_name="$2"

            if [ ! -f "$file_path" ]; then
              echo "⚠️ Không tìm thấy file: $file_path"
              return
            fi

            echo "--------------------------------------------------"
            echo "🚀 Đang xử lý đẩy: $relative_name ($(du -sh "$file_path" | cut -f1))"

            # Upload Google Drive
            if [ "$UPLOAD_GDRIVE" = "true" ] && [ "$HAS_RCLONE" -eq 1 ]; then
              echo "  ↳ Tải lên Google Drive..."
              SUBDIR=$(dirname "$relative_name")
              if [ "$SUBDIR" = "." ]; then
                rclone copy "$file_path" "gdrive:Mirror-Cloud" --drive-chunk-size 64M --progress
              else
                rclone copy "$file_path" "gdrive:Mirror-Cloud/$SUBDIR" --drive-chunk-size 64M --progress
              fi
            fi

            # Upload Hugging Face (Dùng python -m để bảo đảm chạy độc lập với PATH)
            if [ "$UPLOAD_HF" = "true" ] && [ -n "${HF_TOKEN:-}" ]; then
              echo "  ↳ Tải lên Hugging Face..."
              python3 -m huggingface_hub.cli.hf upload "$HF_REPO_NAME" \
                "$file_path" \
                "$relative_name" \
                --repo-type model \
                --token "$HF_TOKEN"
            fi

            # Upload Archive.org
            if [ "$UPLOAD_IA" = "true" ] && [ -f ~/.config/ia.ini ]; then
              echo "  ↳ Tải lên Archive.org..."
              ia upload "$ITEM_ID" "$file_path" \
                --remote-name="$relative_name" \
                --metadata="mediatype:software" \
                --metadata="collection:opensource_software" \
                --header="x-archive-queue-derive:0" \
                --retries=3
            fi

            echo "🧹 Xóa file cục bộ để hồi phục dung lượng ổ đĩa..."
            rm -f "$file_path"
            df -h /
          }

          # 3. Phân luồng xử lý nguồn tải
          # A. GOOGLE DRIVE FOLDER (Tải & Upload từng file)
          if echo "$RAW_URL" | grep -qE "drive\.google\.com|drive\.usercontent\.google\.com"; then
            CLEAN_URL=$(echo "$RAW_URL" | sed 's/\/mobile//g' | cut -d'?' -f1)

            if echo "$RAW_URL" | grep -qE "folders\/|folder"; then
              TARGET_ID=$(echo "$CLEAN_URL" | grep -oP 'folders\/\K[a-zA-Z0-9_-]+' || echo "$RAW_URL" | grep -oP 'id=\K[a-zA-Z0-9_-]+' | head -n 1)
              echo "📦 Nguồn: Google Drive Folder (ID: $TARGET_ID)"

              if [ "$HAS_RCLONE" -ne 1 ]; then
                echo "❌ Bắt buộc cần RCLONE_CONFIG để duyệt và stream từng file từ Folder Google Drive!"
                exit 1
              fi

              echo "📋 Đang lấy danh sách các file trong folder..."
              rclone lsf "gdrive:" --drive-root-folder-id="$TARGET_ID" --recursive --files-only > file_list.txt

              echo "Tìm thấy $(wc -l < file_list.txt) file cần chuyển giao:"
              cat file_list.txt

              while IFS= read -r rel_file || [ -n "$rel_file" ]; do
                [ -z "$rel_file" ] && continue
                echo "=================================================="
                echo "📥 Đang tải: $rel_file"
                
                mkdir -p "work_dir/$(dirname "$rel_file")"
                
                rclone copyto "gdrive:$rel_file" "work_dir/$rel_file" \
                  --drive-root-folder-id="$TARGET_ID" \
                  --progress \
                  --drive-acknowledge-abuse

                upload_and_cleanup_file "work_dir/$rel_file" "$rel_file"

              done < file_list.txt

            # B. GOOGLE DRIVE FILE ĐƠN LẺ
            else
              TARGET_ID=$(echo "$CLEAN_URL" | grep -oP '\/d\/\K[a-zA-Z0-9_-]+' || echo "$RAW_URL" | grep -oP 'id=\K[a-zA-Z0-9_-]+' | head -n 1)
              echo "📦 Nguồn: Google Drive Single File (ID: $TARGET_ID)"

              cd work_dir
              COOKIE_OPT=""
              if [ -n "${GDRIVE_COOKIES:-}" ]; then
                echo "$GDRIVE_COOKIES" > cookies.txt
                COOKIE_OPT="--cookies cookies.txt"
              fi

              gdown "https://drive.google.com/uc?id=${TARGET_ID}" $COOKIE_OPT || \
              aria2c --header="User-Agent: $USER_AGENT" \
                     --check-certificate=false \
                     --allow-overwrite=true \
                     --content-disposition \
                     -s16 -x16 -j16 \
                     "https://drive.google.com/uc?export=download&id=${TARGET_ID}"
              cd ..

              SINGLE_FILE=$(find work_dir -type f ! -name "cookies.txt" | head -n 1)
              FILE_NAME=$(basename "$SINGLE_FILE")
              upload_and_cleanup_file "$SINGLE_FILE" "$FILE_NAME"
            fi

          # C. PIXELDRAIN
          elif echo "$RAW_URL" | grep -q "pixeldrain.com"; then
            echo "📦 Nguồn: Pixeldrain"
            PIXEL_ID=$(echo "$RAW_URL" | grep -oP '(u\/|file\/)\K[a-zA-Z0-9]+')
            DIRECT_PIXEL="https://pixeldrain.com/api/file/${PIXEL_ID}"
            cd work_dir
            aria2c --header="User-Agent: $USER_AGENT" \
                   --check-certificate=false \
                   --content-disposition \
                   -s16 -x16 -j16 \
                   "$DIRECT_PIXEL"
            cd ..
            SINGLE_FILE=$(find work_dir -type f | head -n 1)
            FILE_NAME=$(basename "$SINGLE_FILE")
            upload_and_cleanup_file "$SINGLE_FILE" "$FILE_NAME"

          # D. DIRECT LINK
          else
            echo "🌐 Nguồn: Direct Link"
            cd work_dir
            wget -c --progress=bar:force:noscroll --content-disposition "$RAW_URL"
            cd ..
            SINGLE_FILE=$(find work_dir -type f | head -n 1)
            FILE_NAME=$(basename "$SINGLE_FILE")
            upload_and_cleanup_file "$SINGLE_FILE" "$FILE_NAME"
          fi

          # Ghi nhận kết quả
          if [ "$UPLOAD_GDRIVE" = "true" ] && [ "$HAS_RCLONE" -eq 1 ]; then
            GDRIVE_LINK=$(rclone link "gdrive:Mirror-Cloud" 2>/dev/null || echo "")
            echo "GDRIVE_LINK=${GDRIVE_LINK}" >> $GITHUB_ENV
          fi
          if [ "$UPLOAD_HF" = "true" ]; then
            echo "HF_REPO=https://huggingface.co/${HF_REPO_NAME}/tree/main" >> $GITHUB_ENV
          fi
          if [ "$UPLOAD_IA" = "true" ]; then
            echo "IA_LINK=https://archive.org/details/${ITEM_ID}" >> $GITHUB_ENV
          fi

      - name: Workflow Summary
        if: always()
        run: |
          echo "=========================================="
          echo "             WORKFLOW REPORT              "
          echo "=========================================="

          if [ "${{ job.status }}" == "success" ]; then
            {
              echo "### ✅ Mirror Completed Successfully"
              echo ""
              echo "- **Link gốc:** [${{ github.event.inputs.file_url }}](${{ github.event.inputs.file_url }})"
              if [ -n "${GDRIVE_LINK:-}" ]; then
                echo "- **Google Drive:** [Truy cập thư mục](${GDRIVE_LINK})"
              fi
              if [ -n "${HF_REPO:-}" ]; then
                echo "- **Hugging Face Files:** [Duyệt file trên Repo](${HF_REPO})"
              fi
              if [ -n "${IA_LINK:-}" ]; then
                echo "- **Archive.org Details:** [Xem trên Archive](${IA_LINK})"
              fi
            } >> $GITHUB_STEP_SUMMARY
          else
            {
              echo "### ❌ Mirror Failed"
              echo ""
              echo "- **Link gốc:** [${{ github.event.inputs.file_url }}](${{ github.event.inputs.file_url }})"
              echo "- Quá trình tải hoặc đồng bộ file gặp lỗi. Vui lòng kiểm tra lại log chi tiết."
            } >> $GITHUB_STEP_SUMMARY
          fi
