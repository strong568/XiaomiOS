name: Extract Framework Only

on:
  workflow_dispatch:
    inputs:
      input_url:
        description: 'Link tải ROM (Direct link / OTA zip / GDrive / Pixeldrain / Gofile / MediaFire / SourceForge...)'
        required: true
      rom_title:
        description: 'Tên/Mã bản ROM (VD: Munch_kiproject-HOS4-port_OS4.0.2.0.XPKMIXM_encrypt_ki-ker_v2_20261116)'
        required: false
        default: 'Custom_ROM'
      rom_changelog:
        description: 'Changelog & Note (Dùng \n để xuống dòng)'
        required: false
        default: ''
      include_settings:
        description: 'Lấy thêm Settings.apk (system_ext/priv-app/Settings/Settings.apk)'
        type: boolean
        required: false
        default: false
      include_product_overlay:
        description: 'Lấy thêm product/overlay (product/overlay)'
        type: boolean
        required: false
        default: false
      include_product_etc:
        description: 'Lấy thêm product/etc (product/etc)'
        type: boolean
        required: false
        default: false
      builder_name:
        description: 'Tên người thực hiện'
        required: false
        default: 'Admin'

jobs:
  Extract-Framework:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          swap-size-mb: 1024
          root-reserve-mb: 512
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Clean All Unused file, application
        run: |
          docker rmi `docker images -q` || true
          sudo apt-get -y purge azure-cli ghc* zulu* hhvm llvm* firefox google* dotnet* powershell php* || true
          sudo apt-get -y autoremove --purge || true
          sudo rm -rf /usr/share/dotnet /etc/php /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          sudo apt-get -y autoclean && sudo apt-get clean

      - name: Checkout repository
        uses: actions/checkout@main

      - name: Set up Timezone
        run: sudo timedatectl set-timezone Asia/Ho_Chi_Minh

      - name: Install Dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo rm -f /var/lib/dpkg/info/mysql*
          echo "set man-db/auto-update false" | sudo debconf-communicate
          sudo dpkg-reconfigure -f noninteractive man-db || true
          sudo dpkg --configure -a || true
          sudo bash setup.sh
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends xmlstarlet aapt zipalign p7zip-full libarchive-tools libc++1 libc++abi1 unzip aria2 zstd lz4 brotli file android-sdk-libsparse-utils curl jq python3-pip
          sudo pip3 install --break-system-packages --no-cache-dir -q gdown || sudo pip3 install --no-cache-dir -q gdown
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libc++.so.1 /usr/lib/x86_64-linux-gnu/libc++.so 2>/dev/null || true
          sudo ldconfig
          sudo chmod -R 777 bin/ *.sh

      - name: Download & Unpack Partitions
        env:
          INPUT_URL: ${{ inputs.input_url }}
        run: |
          sudo bash -c '
            set -e
            INPUT_URL="$1"
            GH_ENV="$2"
            work_dir=$(pwd)
            export PATH="/usr/local/bin:$HOME/.local/bin:$work_dir/bin/$(uname)/$(uname -m)/:$PATH"
            export LD_LIBRARY_PATH="$work_dir/bin/$(uname)/$(uname -m)/lib:$work_dir/bin/$(uname)/$(uname -m)/:/usr/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH"
            source "$work_dir/functions.sh"

            # Giải mã script fast_lpunpack.py từ Base64 (tránh tuyệt đối lỗi cú pháp YAML)
            echo "" | base64 -d > /tmp/fast_lpunpack.py

            extract_from_zip() {
              local zip_file="$1"
              local target_pattern="$2"
              local out_dir="$3"
              echo "[INFO] Extracting $target_pattern using bsdtar/unzip..."
              if command -v bsdtar >/dev/null 2>&1; then
                bsdtar -xvf "$zip_file" -C "$out_dir" --include="*${target_pattern}" || unzip -o -j "$zip_file" "*${target_pattern}" -d "$out_dir" || 7z e -y "$zip_file" "${target_pattern}" -r -o"$out_dir"
              else
                unzip -o -j "$zip_file" "*${target_pattern}" -d "$out_dir" || 7z e -y "$zip_file" "${target_pattern}" -r -o"$out_dir"
              fi
              find "$out_dir" -mindepth 2 -type f -exec mv -f {} "$out_dir/" \; 2>/dev/null || true
            }

            process_super_image() {
              local img_file="$1"
              local out_dir="$2"

              local magic_hex=$(head -c 4 "$img_file" | od -An -tx1 | tr -d " \n")
              if [[ "$magic_hex" == "28b52ffd" ]]; then
                mv "$img_file" "${img_file}.zst"
                zstd -d --rm "${img_file}.zst" -o "$img_file"
              elif [[ "$magic_hex" == "04224d18" ]]; then
                mv "$img_file" "${img_file}.lz4"
                lz4 -d --rm "${img_file}.lz4" "$img_file"
              elif [[ "$magic_hex" == "1f8b"* ]]; then
                mv "$img_file" "${img_file}.gz"
                gzip -d "$img_file.gz"
              fi

              magic_hex=$(head -c 4 "$img_file" | od -An -tx1 | tr -d " \n")
              if [[ "$magic_hex" == "3aff26ed" ]] || file "$img_file" | grep -q "Android sparse image"; then
                echo "[INFO] Converting sparse super.img to raw..."
                /usr/bin/simg2img "$img_file" "${img_file}.raw"
                rm -f "$img_file"
                mv -f "${img_file}.raw" "$img_file"
              fi

              local lp_offset=$(python3 -c "import sys; data=open(sys.argv[1],\"rb\").read(16777216); offsets=[data.find(s) for s in (b\"gDla\",b\"alDg\") if data.find(s)!=-1]; print(min(offsets) if offsets else -1)" "$img_file")
              if [ "$lp_offset" -gt 4096 ]; then
                local skip_bytes=$((lp_offset - 4096))
                dd if="$img_file" of="${img_file}.fixed" bs=4096 skip=$((skip_bytes / 4096)) status=none
                rm -f "$img_file"
                mv -f "${img_file}.fixed" "$img_file"
              elif [ "$lp_offset" -eq -1 ]; then
                mv -f "$img_file" "$out_dir/system.img"
                return 0
              fi

              if [ -x "$work_dir/bin/Linux/x86_64/lpunpack" ] && "$work_dir/bin/Linux/x86_64/lpunpack" "$img_file" "$out_dir" 2>/dev/null; then
                echo "[INFO] Unpacked with native lpunpack."
              else
                echo "[INFO] Native lpunpack rejected checksum, unpacking with fast_lpunpack.py..."
                python3 /tmp/fast_lpunpack.py "$img_file" "$out_dir"
              fi

              rm -f "$img_file"
              for i in "$out_dir"/*_a.img; do
                [ -f "$i" ] && mv "$i" "${i%_a.img}.img"
              done
            }

            # 1. Bộ tải đa năng hỗ trợ mọi loại link
            download_universal_rom() {
              local url="$1"
              echo "[INFO] Đang xử lý link tải: $url"

              if [[ "$url" =~ drive\.google\.com ]]; then
                echo "[INFO] Nhận diện link Google Drive..."
                if [[ "$url" =~ /folders/ ]]; then
                  python3 -m gdown --folder "$url" -O "$work_dir/"
                else
                  python3 -m gdown "$url" -O "$work_dir/"
                fi

              elif [[ "$url" =~ pixeldrain\.com/(u|l)/([a-zA-Z0-9]+) ]]; then
                local type="${BASH_REMATCH[1]}"
                local id="${BASH_REMATCH[2]}"
                echo "[INFO] Nhận diện link Pixeldrain ($id)..."
                if [[ "$type" == "u" ]]; then
                  aria2c -x 16 -s 16 -k 1M --content-disposition "https://pixeldrain.com/api/file/${id}?download" -d "$work_dir"
                else
                  aria2c -x 16 -s 16 -k 1M --content-disposition "https://pixeldrain.com/api/list/${id}/zip" -d "$work_dir"
                fi

              elif [[ "$url" =~ gofile\.io/d/([a-zA-Z0-9]+) ]]; then
                local content_id="${BASH_REMATCH[1]}"
                echo "[INFO] Nhận diện link Gofile ($content_id)..."
                local token=$(curl -s -X POST "https://api.gofile.io/accounts" | jq -r ".data.token")
                local dl_link=$(curl -s -H "Authorization: Bearer $token" "https://api.gofile.io/contents/${content_id}?wt=4fd6sg89d7s6" | jq -r ".data.children | to_entries[0].value.link")
                aria2c -x 16 -s 16 -k 1M --header="Cookie: accountToken=$token" --content-disposition "$dl_link" -d "$work_dir"

              elif [[ "$url" =~ mediafire\.com ]]; then
                echo "[INFO] Nhận diện link MediaFire..."
                local direct_mf=$(curl -sL "$url" | grep -oE "https://download[0-9]+\.mediafire\.com/[^\"]+" | head -n 1)
                aria2c -x 16 -s 16 -k 1M --content-disposition "$direct_mf" -d "$work_dir"

              elif [[ "$url" =~ sourceforge\.net ]]; then
                echo "[INFO] Nhận diện link SourceForge..."
                local sf_url="${url%/download}"
                aria2c -x 16 -s 16 -k 1M --content-disposition -U "Mozilla/5.0" "$sf_url" -d "$work_dir"

              else
                if [ -f "$work_dir/bin/ddevice/getROM.sh" ]; then
                  sed "/# ==================== NHẬN DIỆN OS ====================/,\$d" "$work_dir/bin/ddevice/getROM.sh" > /tmp/download_only.sh
                  source /tmp/download_only.sh "$url" || aria2c -x 16 -s 16 -k 1M --content-disposition -U "Mozilla/5.0" "$url" -d "$work_dir"
                else
                  aria2c -x 16 -s 16 -k 1M --content-disposition -U "Mozilla/5.0" "$url" -d "$work_dir"
                fi
              fi
            }

            download_universal_rom "$INPUT_URL"

            if [[ ! -f "$baserom" ]]; then
                baserom=$(find "$work_dir" -maxdepth 2 -type f \( -iname "*.zip" -o -iname "*.tgz" -o -iname "*.tar.gz" -o -iname "*.bin" -o -iname "*.img" \) ! -name "magisk*" ! -name "twrp*" -printf "%s %p\n" 2>/dev/null | sort -nr | head -n 1 | cut -d" " -f2-)
            fi

            if [[ ! -f "$baserom" ]]; then
                echo "[ERROR] Không tìm thấy file ROM sau khi tải!"
                exit 1
            fi

            echo "[INFO] File ROM đã tải: $baserom"
            echo "STOCK_BASEROM=$baserom" >> "$GH_ENV"

            rm -rf build/baserom/
            mkdir -p build/baserom/images/ "$work_dir/bin/ddevice"

            # 2. Giải nén theo định dạng ROM
            if [[ "$baserom" =~ \.(tgz|tar\.gz)$ ]]; then
                echo "[INFO] Extracting Fastboot ROM (.tgz/.tar.gz)..."
                tar -xzf "$baserom" -C build/baserom/
                rm -f "$baserom"
                super_img=$(find build/baserom/ -name "super.img" | head -n 1)
                if [ -n "$super_img" ]; then
                    process_super_image "$super_img" "build/baserom/images"
                fi
            elif [[ "$baserom" =~ \.bin$ ]]; then
                echo "[INFO] Extracting direct payload.bin..."
                payload-extract extract -o build/baserom/images/ "$baserom"
                rm -f "$baserom"
            else
                zip_list=$(unzip -Z1 "$baserom" 2>/dev/null || 7z l -slt "$baserom" | grep "^Path = " | sed "s/^Path = //")

                if echo "$zip_list" | grep -q "payload\.bin$"; then
                    extract_from_zip "$baserom" "payload.bin" "build/baserom"
                    rm -f "$baserom"
                    payload-extract extract -o build/baserom/images/ build/baserom/payload.bin
                    rm -f build/baserom/payload.bin

                elif echo "$zip_list" | grep -q "\.br$"; then
                    echo "[INFO] Extracting new.dat.br..."
                    7z x -y "$baserom" -obuild/baserom >/dev/null
                    rm -f "$baserom"
                    super_list=$(grep "add " build/baserom/dynamic_partitions_op_list | awk "{ print \$2 }")
                    for part in ${super_list}; do
                        brotli -d "build/baserom/$part.new.dat.br"
                        python3 "$work_dir/bin/Linux/x86_64/sdat2img.py" "build/baserom/$part.transfer.list" "build/baserom/$part.new.dat" "build/baserom/images/$part.img"
                        rm -f "build/baserom/$part.new.dat"
                    done

                elif echo "$zip_list" | grep -q "super\.img\.zst$"; then
                    extract_from_zip "$baserom" "super.img.zst" "build/baserom"
                    rm -f "$baserom"
                    zstd -d --rm build/baserom/super.img.zst -o build/baserom/super.img
                    process_super_image "build/baserom/super.img" "build/baserom/images"

                elif echo "$zip_list" | grep -q "super\.img$"; then
                    extract_from_zip "$baserom" "super.img" "build/baserom"
                    rm -f "$baserom"
                    process_super_image "build/baserom/super.img" "build/baserom/images"

                elif echo "$zip_list" | grep -q "super\.img\."; then
                    echo "[INFO] Extracting split super.img.*..."
                    unzip -o -j "$baserom" "*super.img.*" -d build/baserom || 7z e -y "$baserom" "*super.img.*" -r -obuild/baserom
                    rm -f "$baserom"
                    /usr/bin/simg2img build/baserom/*super.img.* build/baserom/super.img
                    rm -f build/baserom/*super.img.*
                    process_super_image "build/baserom/super.img" "build/baserom/images"

                else
                    echo "[ERROR] Định dạng ROM không hỗ trợ! Danh sách file trong gói:"
                    echo "$zip_list" | head -n 20
                    exit 1
                fi
            fi

            find "$work_dir/build/baserom/images" -maxdepth 1 -name "*.img" ! -name "system.img" ! -name "system_ext.img" ! -name "product.img" ! -name "vendor.img" -delete

            # 3. Bung các phân vùng cần thiết
            for part in system system_ext product vendor; do
                if [ -f "$work_dir/build/baserom/images/${part}.img" ]; then
                    echo "[INFO] Unpacking ${part}.img..."
                    extract_partition "$work_dir/build/baserom/images/${part}.img" "$work_dir/build/baserom/images"
                    rm -f "$work_dir/build/baserom/images/${part}.img"
                fi
            done
          ' _ "$INPUT_URL" "$GITHUB_ENV"

      - name: Extract Framework
        run: |
          sudo chmod +x frameworkExtract.sh
          sudo env GITHUB_ENV="$GITHUB_ENV" GITHUB_OUTPUT="$GITHUB_OUTPUT" bash frameworkExtract.sh stock "${{ env.STOCK_BASEROM }}"

      - name: Append Optional Files & Folders
        if: ${{ inputs.include_settings || inputs.include_product_overlay || inputs.include_product_etc }}
        env:
          INC_SETTINGS: ${{ inputs.include_settings }}
          INC_OVERLAY: ${{ inputs.include_product_overlay }}
          INC_ETC: ${{ inputs.include_product_etc }}
        run: |
          sudo env \
            INC_SETTINGS="$INC_SETTINGS" \
            INC_OVERLAY="$INC_OVERLAY" \
            INC_ETC="$INC_ETC" \
            DUMP_STOCK_PATH="${{ env.DUMP_STOCK_PATH }}" \
            bash -c '
              work_dir=$(pwd)
              base_img_dir="$work_dir/build/baserom/images"
              tmp_dir="/tmp/add_optional_items"
              rm -rf "$tmp_dir"
              mkdir -p "$tmp_dir"
              has_added=false

              copy_item() {
                local rel_path="$1"
                local part_prefix="${rel_path%%/*}"
                local src_item="$base_img_dir/$rel_path"

                if [ ! -e "$src_item" ] && [ -e "$base_img_dir/$part_prefix/$rel_path" ]; then
                  src_item="$base_img_dir/$part_prefix/$rel_path"
                fi

                if [ -e "$src_item" ]; then
                  mkdir -p "$tmp_dir/$(dirname "$rel_path")"
                  cp -rf "$src_item" "$tmp_dir/$rel_path"
                  echo "[FOUND] Đã thêm $rel_path vào gói Framework"
                  has_added=true
                else
                  echo "[WARNING] Không tìm thấy đường dẫn: $rel_path"
                fi
              }

              [ "$INC_SETTINGS" == "true" ] && copy_item "system_ext/priv-app/Settings/Settings.apk"
              [ "$INC_OVERLAY" == "true" ] && copy_item "product/overlay"
              [ "$INC_ETC" == "true" ] && copy_item "product/etc"

              if [ "$has_added" == "true" ]; then
                pushd "$tmp_dir" > /dev/null
                zip -ur "$DUMP_STOCK_PATH" ./*
                popd > /dev/null
              fi
              rm -rf "$tmp_dir"
            '

      - name: Upload Framework to Artifacts
        uses: actions/upload-artifact@v4
        if: env.DUMP_STOCK_PATH != ''
        with:
          name: ${{ env.DUMP_STOCK_NAME }}
          path: ${{ env.DUMP_STOCK_PATH }}
          retention-days: 7

      - name: Prepare Release Info
        id: release_info
        env:
          ROM_TITLE: ${{ inputs.rom_title }}
          RAW_CHANGELOG: ${{ inputs.rom_changelog }}
          INPUT_URL: ${{ inputs.input_url }}
          INC_SETTINGS: ${{ inputs.include_settings }}
          INC_OVERLAY: ${{ inputs.include_product_overlay }}
          INC_ETC: ${{ inputs.include_product_etc }}
          BUILDER_NAME: ${{ inputs.builder_name }}
        run: |
          TAG_NAME="Framework_$(date +'%Y%m%d_%H%M%S')"
          BUILD_TIME="$(date +'%Y-%m-%d %H:%M:%S')"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

          {
            echo "**Bản ROM:** \`$ROM_TITLE\`"
            echo ""
            if [ -n "$RAW_CHANGELOG" ]; then
              printf "%b\n\n---\n" "$RAW_CHANGELOG"
            fi
            echo "### Chi tiết trích xuất"
            echo "- **URL nguồn:** \`$INPUT_URL\`"
            echo "- **Kèm Settings.apk:** \`$INC_SETTINGS\`"
            echo "- **Kèm product/overlay:** \`$INC_OVERLAY\`"
            echo "- **Kèm product/etc:** \`$INC_ETC\`"
            echo "- **Người thực hiện:** \`$BUILDER_NAME\`"
            echo "- **Thời gian:** \`$BUILD_TIME\`"
          } > /tmp/release_body.md

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: env.DUMP_STOCK_PATH != ''
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: "Framework - ${{ inputs.rom_title }}"
          body_path: /tmp/release_body.md
          files: |
            ${{ env.DUMP_STOCK_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
