name: mirror-cloud (Multi-Host to Archive.org & Hugging Face)

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: "Google Drive / Pixeldrain / Direct download link"
        required: true

      ia_item_id:
        description: "Archive.org Item ID"
        required: true
        default: "mirror-cloud"

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip aria2 wget curl
          pip3 install --no-cache-dir gdown internetarchive huggingface_hub

      - name: Download file / folder (Multi-host support)
        env:
          GDRIVE_COOKIES: ${{ secrets.GDRIVE_COOKIES }}
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
        run: |
          echo "🔽 Bắt đầu xử lý..."
          RAW_URL="${{ github.event.inputs.file_url }}"
          USER_AGENT="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"

          # Thiết lập cookie nếu có
          COOKIE_OPT=""
          if [ -n "${GDRIVE_COOKIES:-}" ]; then
            echo "🔑 Đã tìm thấy cookie Google Drive..."
            echo "$GDRIVE_COOKIES" > cookies.txt
            COOKIE_OPT="--cookies cookies.txt"
          fi

          # Thiết lập Rclone nếu có
          if [ -n "${RCLONE_CONFIG_DATA:-}" ]; then
            mkdir -p ~/.config/rclone
            echo "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf
          fi

          # 1. Xử lý Google Drive
          if echo "$RAW_URL" | grep -qE "drive\.google\.com|drive\.usercontent\.google\.com"; then
            echo "📦 Nhận diện: Google Drive"

            # Kiểm tra nếu là FOLDER
            if echo "$RAW_URL" | grep -q "/folders/"; then
              FOLDER_ID=$(echo "$RAW_URL" | grep -oP 'folders\/\K[a-zA-Z0-9_-]+')
              echo "📂 Phát hiện Thư mục (Folder ID: $FOLDER_ID)"
              
              # Dùng Rclone tải thẳng toàn bộ Folder về runner
              rclone copy "gdrive,root_folder_id=${FOLDER_ID}:" ./downloaded_folder --progress --transfers 4
              
              # Nén lại thành 1 file zip để upload lên HuggingFace / Archive.org
              FILE_NAME="Drive_Folder_${FOLDER_ID}.zip"
              zip -r "$FILE_NAME" ./downloaded_folder
              rm -rf ./downloaded_folder

            # Xử lý FILE đơn lẻ
            else
              FILE_ID=$(echo "$RAW_URL" | grep -oP '(id=|\/d\/)\K[a-zA-Z0-9_-]+' | head -n 1)
              echo "📄 File ID: $FILE_ID"

              # Cách A: Thử copy trực tiếp bằng Rclone (Server-side bypass quota)
              if [ -f ~/.config/rclone/rclone.conf ]; then
                echo "🚀 Thử clone trực tiếp qua Rclone copyid..."
                rclone backend copyid gdrive: "$FILE_ID" "./" || true
              fi

              # Cách B: Nếu chưa tải được thì dùng gdown kèm Cookie
              if [ -z "$(ls -A | grep -v 'cookies.txt')" ]; then
                echo "⚡ Chạy gdown với cookie..."
                gdown "https://drive.google.com/uc?id=${FILE_ID}" $COOKIE_OPT || \
                aria2c --header="User-Agent: $USER_AGENT" \
                       --check-certificate=false \
                       --allow-overwrite=true \
                       --auto-file-renaming=false \
                       --content-disposition \
                       -s16 -x16 -j16 \
                       "$RAW_URL"
              fi
            fi

          # 2. Pixeldrain
          elif echo "$RAW_URL" | grep -q "pixeldrain.com"; then
            echo "📦 Nhận diện: Pixeldrain"
            PIXEL_ID=$(echo "$RAW_URL" | grep -oP '(u\/|file\/)\K[a-zA-Z0-9]+')
            DIRECT_PIXEL="https://pixeldrain.com/api/file/${PIXEL_ID}"
            aria2c --header="User-Agent: $USER_AGENT" -s16 -x16 -j16 "$DIRECT_PIXEL"

          # 3. Direct Link
          else
            echo "🌐 Nhận diện: Direct Link"
            wget -c --progress=bar:force:noscroll --content-disposition "$RAW_URL"
          fi

          echo "📂 File sau khi xử lý:"
          ls -lh

          # Lấy file lớn nhất trong thư mục (loại trừ các file config, txt)
          FILE_NAME=$(ls -S | grep -vE '\.txt$|\.yml$' | head -n 1)
          FILE_SIZE=$(stat -c%s "$FILE_NAME")

          echo "FILE_NAME=$FILE_NAME" >> $GITHUB_ENV
          echo "FILE_SIZE=$FILE_SIZE" >> $GITHUB_ENV
          echo "✅ Sẵn sàng upload: $FILE_NAME ($FILE_SIZE bytes)"

      - name: Upload to Archive.org
        continue-on-error: true
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          echo "🚀 Đang chuẩn bị tải lên Archive.org..."

          if [ -z "${IA_ACCESS_KEY}" ] || [ -z "${IA_SECRET_KEY}" ]; then
            echo "⚠️ CẢNH BÁO: Không tìm thấy IA_ACCESS_KEY hoặc IA_SECRET_KEY trong Secrets, bỏ qua bước này!"
          else
            # Nếu người dùng để mặc định là 'mirror-cloud', tự động thêm hậu tố để tránh trùng item bị khóa
            INPUT_ID="${{ github.event.inputs.ia_item_id }}"
            if [ "$INPUT_ID" == "mirror-cloud" ]; then
              ITEM_ID="mirror-cloud-$(date +%Y%m%d%H%M%S)"
            else
              ITEM_ID="$INPUT_ID"
            fi

            mkdir -p ~/.config
            printf "[s3]\naccess = %s\nsecret = %s\n" "${IA_ACCESS_KEY}" "${IA_SECRET_KEY}" > ~/.config/ia.ini

            DOWNLOAD_URL="https://archive.org/download/${ITEM_ID}/${FILE_NAME}"
            echo "Bắt đầu upload $FILE_NAME lên item: $ITEM_ID..."

            # Bật cờ x-archive-queue-derive:0 để Archive.org không quét/mở file nén gây lỗi
            if ia upload "$ITEM_ID" "$FILE_NAME" \
                --metadata="mediatype:software" \
                --metadata="collection:opensource_software" \
                --header="x-archive-queue-derive:0" \
                --retries=3; then
              echo "IA_LINK=${DOWNLOAD_URL}" >> $GITHUB_ENV
              echo "✅ Upload Archive.org hoàn tất: ${DOWNLOAD_URL}"
            else
              echo "❌ Upload lên Archive.org thất bại!"
            fi
          fi


      - name: Upload to Hugging Face
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          echo "🚀 Đang chuẩn bị tải lên Hugging Face..."

          if [ -z "${HF_TOKEN}" ]; then
            echo "⚠️ CẢNH BÁO: Không tìm thấy HF_TOKEN trong Secrets, bỏ qua bước này!"
          elif [ -z "${FILE_NAME}" ] || [ ! -f "${FILE_NAME}" ]; then
            echo "❌ CẢNH BÁO: File '${FILE_NAME}' không tồn tại trong thư mục làm việc!"
          else
            echo "Bắt đầu upload $FILE_NAME lên repo Strong568/Mirror-Cloud..."
            
            # Sử dụng huggingface-cli chuẩn, tự động nhận HF_TOKEN từ env mà không cần truyền flag --token
            huggingface-cli upload Strong568/Mirror-Cloud \
              "$FILE_NAME" \
              "$FILE_NAME" \
              --repo-type model

            HF_LINK="https://huggingface.co/Strong568/Mirror-Cloud/resolve/main/${FILE_NAME}"
            echo "HF_LINK=${HF_LINK}" >> $GITHUB_ENV
            echo "✅ Upload Hugging Face hoàn tất: ${HF_LINK}"
          fi


      - name: Workflow Summary & Notification
        if: always()
        run: |
          ITEM_ID="${{ github.event.inputs.ia_item_id }}"

          echo "=========================================="
          echo "             WORKFLOW REPORT              "
          echo "=========================================="
          
          if [ "${{ job.status }}" == "success" ]; then
            echo "TRẠNG THÁI   : THÀNH CÔNG (SUCCESS)"
            echo "LINK GỐC     : ${{ github.event.inputs.file_url }}"
            echo "ARCHIVE LINK : ${IA_LINK:-N/A}"
            echo "HF LINK      : ${HF_LINK:-N/A}"
            echo "TÊN FILE     : ${FILE_NAME}"
            echo "DUNG LƯỢNG   : ${FILE_SIZE} bytes"
            echo "ITEM ID      : $ITEM_ID"
            echo "=========================================="

            {
              echo "### ✅ ROM Mirror Completed Successfully"
              echo ""
              echo "- **Link gốc (Input):** [${{ github.event.inputs.file_url }}](${{ github.event.inputs.file_url }})"
              if [ -n "${IA_LINK:-}" ]; then
                echo "- **Archive.org Download:** [Tải từ Archive.org](${IA_LINK})"
              fi
              if [ -n "${HF_LINK:-}" ]; then
                echo "- **Hugging Face Direct Download:** [Tải từ Hugging Face](${HF_LINK})"
                echo "- **Hugging Face Repo:** [Strong568/Mirror-Cloud](https://huggingface.co/Strong568/Mirror-Cloud)"
              fi
              echo "- **File Name:** \`${FILE_NAME}\`"
              echo "- **File Size:** \`${FILE_SIZE} bytes\`"
              echo "- **Archive.org Item ID:** \`$ITEM_ID\`"
            } >> $GITHUB_STEP_SUMMARY
          else
            echo "TRẠNG THÁI   : THẤT BẠI (FAILED)"
            echo "LINK GỐC     : ${{ github.event.inputs.file_url }}"
            echo "ITEM ID      : $ITEM_ID"
            echo "=========================================="

            {
              echo "### ❌ ROM Mirror Failed"
              echo ""
              echo "- **Link gốc (Input):** [${{ github.event.inputs.file_url }}](${{ github.event.inputs.file_url }})"
              echo "- **Item ID:** \`$ITEM_ID\`"
              echo "- *Tải file hoặc upload thất bại. Vui lòng kiểm tra lại log chi tiết ở các bước trên.*"
            } >> $GITHUB_STEP_SUMMARY
          fi
