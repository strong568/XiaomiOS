name: PenguinOS Xiaomi ROM Build

on:
  workflow_dispatch:
    inputs:
      input_url:
        description: 'URL of the ROM to build'
        required: true
      builder_name:
        description: 'Tên người build'
        required: false
      builder_id:
        description: 'ID người build'
        required: false
      
jobs:
  Initialize:
    runs-on: ubuntu-latest
    env:
      # Truyền giá trị giả để notify.py không bị crash nếu thiếu secret Telegram
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || 'disabled' }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID || '0' }}
      PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          swap-size-mb: 1024
          root-reserve-mb: 512
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Clean All Unused file,application
        run: |
          docker rmi `docker images -q` || true
          sudo apt-get -y purge azure-cli ghc* zulu* hhvm llvm* firefox google* dotnet* powershell mysql* php* || true
          sudo apt-get -y autoremove --purge || true
          sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php || true
          sudo apt-get -y autoclean || true
          sudo apt-get clean || true

      - name: Checkout repository
        uses: actions/checkout@main

      - name: Start Notify
        run: |
          pip install requests
          python notify.py start "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" "${{ inputs.builder_name }}" "${{ inputs.builder_id }}" || true

      - name: Set up Time
        run: |
          echo "Setting Vienam timezone"
          sudo timedatectl set-timezone Asia/Ho_Chi_Minh
          
      - name: Install OpenJDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Stuff
        run: |
          sudo bash setup.sh
        
      - name: Giving permission
        run: |
          sudo chmod 777 -R *

      - name: Build ROM...
        env:
          INPUT_URL: ${{ inputs.input_url }}
        run: |
          sudo -E bash build.sh "$INPUT_URL" "${{ github.repository }}" "xiaomi" "${{ inputs.builder_name }}" "${{ inputs.builder_id }}"


      # ================= TRÍCH XUẤT SAU KHI MOD =================
      - name: Extract Modded Framework Files...
        run: |
          sudo -E bash frameworkExtract.sh mod "${{ inputs.input_url }}"

      # ================= UPLOAD 2 FILE ZIP LÊN ARTIFACTS =================
      - name: Upload Stock Framework Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DUMP_STOCK_NAME }}
          path: ${{ env.DUMP_STOCK_PATH }}
          retention-days: 7

      - name: Upload Modded Framework Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DUMP_MOD_NAME }}
          path: ${{ env.DUMP_MOD_PATH }}
          retention-days: 7
      # ===================================================================
          
      - name: Pack ROM...
        run: |
          python notify.py pack "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" "${{ inputs.builder_name }}" "${{ inputs.builder_id }}" || true
          sudo bash packROM.sh

      - name: Upload ROM...
        run: |
          python notify.py upload "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" "${{ inputs.builder_name }}" "${{ inputs.builder_id }}" || true
          
          # Chạy uploadROM.sh (kèm cờ -E để giữ biến PIXELDRAIN_API_KEY)
          sudo -E bash uploadROM.sh
          
          # Đọc link Pixeldrain từ file output do uploadROM.sh tạo ra
          if [ -f "bin/ddevice/output_url.txt" ]; then
            ROM_URL=$(cat bin/ddevice/output_url.txt)
            echo "ROM_URL=$ROM_URL" >> $GITHUB_ENV
            echo "::notice title=Pixeldrain Download Link::$ROM_URL"
          fi
      
      - name: Success Notification
        if: success()
        run: |
          python notify.py success "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" "${{ inputs.builder_name }}" "${{ inputs.builder_id }}" "$ROM_URL" || true

      - name: Failure Notification
        if: failure()
        run: |
          python notify.py fail "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" "${{ inputs.builder_name }}" "${{ inputs.builder_id }}" || true
