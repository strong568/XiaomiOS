name: PenguinOS Xiaomi ROM Build

on:
  workflow_dispatch:
    inputs:
      input_url:
        description: 'URL of the ROM to build'
        required: true
      builder_name:
        description: 'Tên người build'
        required: false
      builder_id:
        description: 'ID người build'
        required: false
      
jobs:
  Initialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || 'disabled' }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID || '0' }}
      PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GOFILE_TOKEN: ${{ secrets.GOFILE_TOKEN }}
      IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
      IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          swap-size-mb: 1024
          root-reserve-mb: 512
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Clean All Unused file,application
        run: |
          docker rmi `docker images -q` || true
          sudo apt-get -y purge azure-cli ghc* zulu* hhvm llvm* firefox google* dotnet* powershell mysql* php* || true
          sudo apt-get -y autoremove --purge || true
          sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php || true
          sudo apt-get -y autoclean || true
          sudo apt-get clean || true

      - name: Checkout repository
        uses: actions/checkout@main

      - name: Start Notify
        run: |
          pip install requests
          python notify.py start "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" "${{ inputs.builder_name }}" "${{ inputs.builder_id }}" || true

      - name: Set up Time
        run: |
          echo "Setting Vienam timezone"
          sudo timedatectl set-timezone Asia/Ho_Chi_Minh
          
      - name: Install OpenJDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Stuff
        run: |
          sudo bash setup.sh
        
      - name: Giving permission
        run: |
          sudo chmod 777 -R *

      # ================= 1. BUILD VÀ MOD ROM =================
      # Lưu ý: build.sh đã tự tải ROM, bung super/payload và gọi trích xuất Stock Framework tự động
      - name: Build ROM...
        env:
          INPUT_URL: ${{ inputs.input_url }}
        run: |
          sudo -E bash build.sh "$INPUT_URL" "${{ github.repository }}" "xiaomi" "${{ inputs.builder_name }}" "${{ inputs.builder_id }}"

      # ================= 2. TRÍCH XUẤT MODDED FRAMEWORK =================
      - name: Extract Modded Framework Files...
        run: |
          sudo -E bash frameworkExtract.sh mod "${{ inputs.input_url }}"

      # ================= 3. GOM FILE VÀ ĐƯA LÊN ARTIFACTS & RELEASE =================
      - name: Prepare Framework Files
        run: |
          mkdir -p framework_out
          # Thu thập tất cả các file zip Framework Stock và Mod được tạo ra
          find . -maxdepth 2 -type f -name "Framework_*.zip" -exec cp -f {} framework_out/ \;
          echo "=== Danh sách file zip Framework ==="
          ls -lh framework_out/

      - name: Upload Framework Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Framework-Files-${{ github.run_id }}
          path: framework_out/Framework_*.zip
          retention-days: 7

      - name: Release Framework to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: framework-${{ github.run_id }}
          name: "Framework Dump: ${{ github.run_id }}"
          body: |
            ### Trích xuất Framework tự động
            - **Run ID**: `${{ github.run_id }}`
            - Bao gồm cả 2 file: Stock Framework và Modded Framework.
          files: |
            framework_out/Framework_STOCK_*.zip
            framework_out/Framework_MOD_*.zip
          draft: false
          prerelease: false

      # ================= 4. PACK VÀ UPLOAD ROM HOÀN CHỈNH =================
      - name: Pack ROM...
        run: |
          python notify.py pack "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" "${{ inputs.builder_name }}" "${{ inputs.builder_id }}" || true
          sudo bash packROM.sh

      - name: Upload ROM and Show link
        env:
          INPUT_URL: ${{ inputs.input_url }}
        run: |
          python notify.py upload "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" "${{ inputs.builder_name }}" "${{ inputs.builder_id }}" || true
          
          # Hiện URL đầu vào lên Annotations
          echo "::notice title=Base ROM Input URL::$INPUT_URL"

          # Chạy uploadROM.sh
          sudo -E bash uploadROM.sh
          
          # Đọc link và hiện lên Annotations
          if [ -f "bin/ddevice/output_url.txt" ]; then
            ROM_URL=$(cat bin/ddevice/output_url.txt)
            echo "ROM_URL=$ROM_URL" >> $GITHUB_ENV

            while IFS= read -r line; do
              [ -z "$line" ] && continue
              title_name=$(echo "$line" | cut -d':' -f1 | xargs)
              link_url=$(echo "$line" | cut -d' ' -f2- | xargs)
              echo "::notice title=${title_name} Download Link::${link_url}"
            done < bin/ddevice/output_url.txt
          fi
      
      - name: Success Notification
        if: success()
        run: |
          python notify.py success "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" "${{ inputs.builder_name }}" "${{ inputs.builder_id }}" "$ROM_URL" || true

      - name: Failure Notification
        if: failure()
        run: |
          python notify.py fail "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" "${{ inputs.builder_name }}" "${{ inputs.builder_id }}" || true
